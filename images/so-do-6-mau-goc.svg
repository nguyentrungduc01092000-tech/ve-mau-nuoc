<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Sơ đồ 6 màu gốc chia thành 3 màu lõi và 3 màu bổ sung">
  <rect width="900" height="340" fill="#f7f3ea"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">6 màu gốc: 3 màu lõi + 3 màu bổ sung</text>
  <g font-family="sans-serif" font-size="14" fill="#1f3a5f">
    <text x="300" y="62" text-anchor="middle" font-weight="bold">3 MÀU LÕI</text>
    <circle cx="150" cy="100" r="32" fill="#f5b90c" stroke="#999" stroke-width="1"/>
    <circle cx="300" cy="100" r="32" fill="#d63384" stroke="#999" stroke-width="1"/>
    <circle cx="450" cy="100" r="32" fill="#2e5fa3" stroke="#999" stroke-width="1"/>
    <text x="150" y="150" text-anchor="middle" font-weight="bold">Vàng nghệ · ấm</text>
    <text x="300" y="150" text-anchor="middle" font-weight="bold">Hồng cánh sen · lạnh</text>
    <text x="450" y="150" text-anchor="middle" font-weight="bold">Xanh ultramarine · ấm</text>
    <text x="150" y="168" text-anchor="middle" font-size="11" fill="#555555">nghiêng về cam</text>
    <text x="300" y="168" text-anchor="middle" font-size="11" fill="#555555">nghiêng về tím</text>
    <text x="450" y="168" text-anchor="middle" font-size="11" fill="#555555">nghiêng về tím</text>
    <text x="300" y="195" text-anchor="middle" font-weight="bold">3 MÀU BỔ SUNG</text>
    <circle cx="150" cy="232" r="32" fill="#f2e14c" stroke="#999" stroke-width="1"/>
    <circle cx="300" cy="232" r="32" fill="#e23b2e" stroke="#999" stroke-width="1"/>
    <circle cx="450" cy="232" r="32" fill="#2f9e8f" stroke="#999" stroke-width="1"/>
    <text x="150" y="282" text-anchor="middle" font-weight="bold">Vàng chanh · lạnh</text>
    <text x="300" y="282" text-anchor="middle" font-weight="bold">Đỏ son · ấm</text>
    <text x="450" y="282" text-anchor="middle" font-weight="bold">Xanh phthalo · lạnh</text>
    <text x="150" y="300" text-anchor="middle" font-size="11" fill="#555555">nghiêng về xanh lá</text>
    <text x="300" y="300" text-anchor="middle" font-size="11" fill="#555555">nghiêng về vàng</text>
    <text x="450" y="300" text-anchor="middle" font-size="11" fill="#555555">nghiêng về xanh lá</text>
    <text x="600" y="90" font-weight="bold">Pha sạch = hai màu nghiêng về nhau:</text>
    <text x="600" y="115">Vàng ấm + Đỏ ấm → Cam sạch</text>
    <text x="600" y="140">Vàng lạnh + Xanh lạnh → Xanh lá tươi</text>
    <text x="600" y="165">Đỏ lạnh + Xanh ấm → Tím sáng</text>
    <text x="600" y="200" font-weight="bold">Pha trầm = hai màu nghiêng ra xa:</text>
    <text x="600" y="225">Vàng ấm + Xanh ấm → Xanh ô liu</text>
    <text x="600" y="250">Đỏ ấm + Xanh lạnh → Tím xám</text>
  </g>
  <text x="450" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">Màu trong sơ đồ chỉ tượng trưng cho hướng nghiêng ấm/lạnh.</text>
</svg>
