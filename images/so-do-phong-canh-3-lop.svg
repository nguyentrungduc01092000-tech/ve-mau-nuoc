<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sơ đồ phong cảnh ba lớp: bầu trời nhạt, núi xa nhạt, núi gần đậm">
  <rect width="900" height="300" fill="#f7f3ea"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Phong cảnh: vẽ từ xa đến gần, từ nhạt đến đậm</text>
  <g font-family="sans-serif" font-size="14" fill="#1f3a5f">
    <rect x="30" y="50" width="840" height="180" rx="10" fill="#ffffff" stroke="#2e5fa3" stroke-width="2"/>
    <rect x="30" y="50" width="840" height="55" rx="10" fill="#a8c8e8" opacity="0.6"/>
    <text x="450" y="82" text-anchor="middle" font-weight="bold">1. Bầu trời — nhạt nhất, vẽ trước</text>
    <polygon points="30,230 250,120 470,230" fill="#8a9bb5" opacity="0.55"/>
    <text x="250" y="150" text-anchor="middle" font-weight="bold">2. Núi xa — nhạt và lạnh</text>
    <polygon points="430,230 650,95 870,230" fill="#3d4a6b" opacity="0.85"/>
    <text x="650" y="140" text-anchor="middle" font-weight="bold" fill="#ffffff">3. Núi gần — đậm và ấm</text>
    <text x="450" y="212" text-anchor="middle">Vật xa nhạt và lạnh, vật gần tối và ấm</text>
  </g>
</svg>
