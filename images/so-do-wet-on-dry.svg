<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sơ đồ so sánh nét vẽ trên giấy ướt và nét vẽ trên giấy khô">
  <rect width="900" height="300" fill="#f7f3ea"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Wet-on-wet và wet-on-dry: mép mờ và mép sắc</text>
  <g font-family="sans-serif" font-size="14" fill="#1f3a5f">
    <rect x="30" y="50" width="400" height="180" rx="10" fill="#ffffff" stroke="#b3543f" stroke-width="2"/>
    <ellipse cx="230" cy="120" rx="120" ry="45" fill="#a8c8e8" opacity="0.55"/>
    <ellipse cx="230" cy="120" rx="80" ry="30" fill="#7fb3e0" opacity="0.8"/>
    <text x="230" y="192" text-anchor="middle" font-weight="bold">Vẽ trên giấy ướt (wet-on-wet)</text>
    <text x="230" y="212" text-anchor="middle">Mép mờ, màu loang ra ngoài nét tô</text>
    <rect x="470" y="50" width="400" height="180" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
    <rect x="560" y="85" width="220" height="70" rx="4" fill="#2e5fa3"/>
    <text x="670" y="192" text-anchor="middle" font-weight="bold">Vẽ trên giấy khô (wet-on-dry)</text>
    <text x="670" y="212" text-anchor="middle">Mép sắc, màu nằm đúng chỗ đã tô</text>
  </g>
  <text x="450" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">Sơ đồ minh họa tự vẽ, không phải ảnh chụp tranh thật.</text>
</svg>
