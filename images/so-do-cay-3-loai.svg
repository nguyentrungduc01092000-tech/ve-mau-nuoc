<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ 3 cây: cây lá rộng, cây thông, rừng thông 3 lớp">
  <title>Sơ đồ 3 cây: cây lá rộng, cây thông, rừng thông 3 lớp</title>
<rect width="900" height="300" fill="#f7f3ea"/>
<text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Ba loại cây: lá rộng, cây thông, rừng thông</text>
<rect x="30" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="150" y="170" width="12" height="60" fill="#8b5a2b"/><circle cx="156" cy="130" r="48" fill="#5da24a"/><circle cx="120" cy="150" r="30" fill="#6fb35a"/><circle cx="195" cy="150" r="30" fill="#4c8f3d"/><text x="160" y="245" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Cây lá rộng</text>
<rect x="320" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="446" y="180" width="8" height="50" fill="#8b5a2b"/><polygon points="450,80 400,150 500,150" fill="#2e6b34"/><polygon points="450,120 395,185 505,185" fill="#3a7d40"/><polygon points="450,160 390,215 510,215" fill="#2e6b34"/><text x="450" y="245" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Cây thông</text>
<rect x="610" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<polygon points="660,200 640,140 680,140" fill="#b9d3ae"/><polygon points="700,200 680,120 720,120" fill="#9cc48d"/><polygon points="750,200 725,100 775,100" fill="#5da24a"/><polygon points="810,200 790,130 830,130" fill="#3a7d40"/><rect x="610" y="200" width="260" height="30" fill="#7fae6d"/><text x="740" y="245" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Rừng thông 3 lớp</text>
<text x="450" y="288" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">Sơ đồ minh họa được vẽ riêng cho website, không phải ảnh chụp tranh thật.</text>
</svg>