<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sơ đồ minh họa vệt loang hình hoa và mảng màu đã sửa sạch">
  <rect width="900" height="300" fill="#f7f3ea"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Vệt loang hình hoa và mảng đã sửa sạch</text>
  <g font-family="sans-serif" font-size="14" fill="#1f3a5f">
    <rect x="30" y="50" width="400" height="180" rx="10" fill="#ffffff" stroke="#b3543f" stroke-width="2"/>
    <circle cx="230" cy="120" r="55" fill="#e8f0f8" stroke="#b3543f" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="230" cy="120" r="28" fill="#dcebf7"/>
    <text x="230" y="170" text-anchor="middle" font-weight="bold">Vệt loang hình hoa (bloom)</text>
    <text x="230" y="192" text-anchor="middle">Vòng sắc tố đậm ở mép, giữa nhạt</text>
    <text x="230" y="212" text-anchor="middle">Nước mới chạm vùng đang khô dở</text>
    <rect x="470" y="50" width="400" height="180" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
    <rect x="560" y="75" width="220" height="90" rx="6" fill="#7fb3e0"/>
    <text x="670" y="192" text-anchor="middle" font-weight="bold">Mảng đã sửa sạch</text>
    <text x="670" y="212" text-anchor="middle">Màu đều, không còn vòng đậm ở mép</text>
  </g>
  <text x="450" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">Hai mảng được vẽ tách nhau để phân biệt rõ.</text>
</svg>
