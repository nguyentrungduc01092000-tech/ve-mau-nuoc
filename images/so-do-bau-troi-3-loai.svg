<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ 3 ô bầu trời: mây trắng, mây bão, mây hoàng hôn">
  <title>Sơ đồ 3 ô bầu trời: mây trắng, mây bão, mây hoàng hôn</title>
<rect width="900" height="300" fill="#f7f3ea"/>
<text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Ba bầu trời: mây trắng, mây bão, hoàng hôn</text>
<rect x="30" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="30" y="50" width="260" height="200" fill="#bcd6f5"/><ellipse cx="130" cy="130" rx="70" ry="30" fill="#ffffff"/><ellipse cx="190" cy="150" rx="60" ry="25" fill="#ffffff"/><ellipse cx="160" cy="120" rx="45" ry="22" fill="#ffffff"/><text x="160" y="235" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Mây trắng</text>
<rect x="320" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="320" y="50" width="260" height="200" fill="#8a97a8"/><ellipse cx="420" cy="130" rx="75" ry="32" fill="#5d6b7d"/><ellipse cx="480" cy="155" rx="65" ry="26" fill="#4a5768"/><ellipse cx="450" cy="115" rx="50" ry="24" fill="#6e7d8f"/><text x="450" y="235" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Mây bão</text>
<rect x="610" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="610" y="50" width="260" height="120" fill="#f2a7b8"/><rect x="610" y="170" width="260" height="80" fill="#7a6ba8"/><ellipse cx="700" cy="120" rx="65" ry="24" fill="#fbe3ea"/><ellipse cx="770" cy="140" rx="55" ry="20" fill="#f6cdd8"/><text x="740" y="235" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Hoàng hôn</text>
<text x="450" y="288" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">Sơ đồ minh họa được vẽ riêng cho website, không phải ảnh chụp tranh thật.</text>
</svg>