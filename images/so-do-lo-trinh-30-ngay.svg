<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ lộ trình 30 ngày: 4 bước từ chọn dụng cụ tới bức vẽ đầu tiên">
  <title>Sơ đồ lộ trình 30 ngày: 4 bước từ chọn dụng cụ tới bức vẽ đầu tiên</title>
<rect width="900" height="300" fill="#f7f3ea"/>
<text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Lộ trình 30 ngày: 4 bước từ chọn dụng cụ tới bức đầu tiên</text>
<rect x="30" y="60" width="190" height="140" fill="#dcebf7" stroke="#1f3a5f" stroke-width="2"/><text x="125" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Bước 1</text><text x="125" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Chọn dụng cụ</text><text x="125" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 1–5</text>
<text x="230" y="135" font-family="sans-serif" font-size="22" fill="#1f3a5f">→</text>
<rect x="250" y="60" width="190" height="140" fill="#fdebd0" stroke="#1f3a5f" stroke-width="2"/><text x="345" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Bước 2</text><text x="345" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Pha màu</text><text x="345" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 6–10</text>
<text x="450" y="135" font-family="sans-serif" font-size="22" fill="#1f3a5f">→</text>
<rect x="470" y="60" width="190" height="140" fill="#ddefd8" stroke="#1f3a5f" stroke-width="2"/><text x="565" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Bước 3</text><text x="565" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Tập loang màu</text><text x="565" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 11–17</text>
<text x="670" y="135" font-family="sans-serif" font-size="22" fill="#1f3a5f">→</text>
<rect x="690" y="60" width="180" height="140" fill="#f3d9e2" stroke="#1f3a5f" stroke-width="2"/><text x="780" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Bước 4</text><text x="780" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Bức đầu tiên</text><text x="780" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 18–30</text>
<text x="450" y="235" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Mỗi ngày 15–20 phút, một bức nhỏ 5–10 cm</text>
</svg>