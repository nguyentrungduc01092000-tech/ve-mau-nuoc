<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ lộ trình 30 ngày: 4 tuần từ nền tảng tới bức tranh hoàn chỉnh">
  <title>Sơ đồ lộ trình 30 ngày: 4 tuần từ nền tảng tới bức tranh hoàn chỉnh</title>
<rect width="900" height="300" fill="#f7f3ea"/>
<text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Lộ trình 30 ngày: 4 tuần từ nền tảng tới tranh hoàn chỉnh</text>
<rect x="30" y="60" width="190" height="140" fill="#dcebf7" stroke="#1f3a5f" stroke-width="2"/><text x="125" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Tuần 1</text><text x="125" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Nền tảng</text><text x="125" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 1–7</text>
<text x="230" y="135" font-family="sans-serif" font-size="22" fill="#1f3a5f">→</text>
<rect x="250" y="60" width="190" height="140" fill="#fdebd0" stroke="#1f3a5f" stroke-width="2"/><text x="345" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Tuần 2</text><text x="345" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Màu sắc</text><text x="345" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 8–14</text>
<text x="450" y="135" font-family="sans-serif" font-size="22" fill="#1f3a5f">→</text>
<rect x="470" y="60" width="190" height="140" fill="#ddefd8" stroke="#1f3a5f" stroke-width="2"/><text x="565" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Tuần 3</text><text x="565" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Chủ đề</text><text x="565" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 15–21</text>
<text x="670" y="135" font-family="sans-serif" font-size="22" fill="#1f3a5f">→</text>
<rect x="690" y="60" width="180" height="140" fill="#f3d9e2" stroke="#1f3a5f" stroke-width="2"/><text x="780" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Tuần 4</text><text x="780" y="140" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Tranh hoàn chỉnh</text><text x="780" y="165" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">Ngày 22–30</text>
<text x="450" y="235" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Mỗi ngày 15–20 phút, một bức nhỏ 5–10 cm</text>
<text x="450" y="288" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">Sơ đồ minh họa tự vẽ, không phải ảnh chụp tranh thật.</text>
</svg>