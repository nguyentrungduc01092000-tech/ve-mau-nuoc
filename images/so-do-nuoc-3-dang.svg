<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ 3 dạng nước: mặt phẳng phản chiếu, gợn sóng ngang, mưa chấm tròn">
  <title>Sơ đồ 3 dạng nước: mặt phẳng phản chiếu, gợn sóng ngang, mưa chấm tròn</title>
<rect width="900" height="300" fill="#f7f3ea"/>
<text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Ba dạng nước: mặt phẳng, gợn sóng, mưa</text>
<rect x="30" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="30" y="50" width="260" height="100" fill="#cfe3f2"/><rect x="30" y="150" width="260" height="100" fill="#9cc3e0"/><polygon points="160,60 140,110 180,110" fill="#2e6b34"/><rect x="156" y="110" width="8" height="40" fill="#8b5a2b"/><polygon points="160,240 140,190 180,190" fill="#5d8fb0"/><rect x="156" y="150" width="8" height="40" fill="#a08a6b"/><text x="160" y="245" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle" dy="-18">Mặt phẳng phản chiếu</text>
<rect x="320" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="320" y="50" width="260" height="200" fill="#bcd6f5"/><path d="M340 120 Q 400 105 460 120 T 560 120" stroke="#1f3a5f" stroke-width="3" fill="none"/><path d="M340 150 Q 400 135 460 150 T 560 150" stroke="#1f3a5f" stroke-width="3" fill="none"/><path d="M340 180 Q 400 165 460 180 T 560 180" stroke="#1f3a5f" stroke-width="3" fill="none"/><path d="M340 210 Q 400 195 460 210 T 560 210" stroke="#1f3a5f" stroke-width="3" fill="none"/><text x="450" y="245" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Gợn sóng ngang</text>
<rect x="610" y="50" width="260" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="610" y="50" width="260" height="200" fill="#cfe3f2"/><circle cx="660" cy="120" r="10" fill="none" stroke="#1f3a5f" stroke-width="2"/><circle cx="720" cy="150" r="13" fill="none" stroke="#1f3a5f" stroke-width="2"/><circle cx="790" cy="110" r="8" fill="none" stroke="#1f3a5f" stroke-width="2"/><circle cx="680" cy="190" r="11" fill="none" stroke="#1f3a5f" stroke-width="2"/><circle cx="770" cy="200" r="9" fill="none" stroke="#1f3a5f" stroke-width="2"/><text x="740" y="245" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle">Mưa chấm tròn</text>
<text x="450" y="288" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">Sơ đồ minh họa tự vẽ, không phải ảnh chụp tranh thật.</text>
</svg>