<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ dãy nhà: mái tam giác, cửa sổ, cửa ra vào, bóng đổ chéo">
  <title>Sơ đồ dãy nhà: mái tam giác, cửa sổ, cửa ra vào, bóng đổ chéo</title>
<rect width="900" height="300" fill="#f7f3ea"/>
<text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Dãy nhà 4 căn: mái, cửa sổ, cửa ra vào, bóng đổ</text>
<rect x="30" y="50" width="840" height="200" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<rect x="90" y="120" width="140" height="110" fill="#f2c9a0"/><polygon points="80,120 160,70 240,120" fill="#b5654a"/><rect x="110" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="180" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="145" y="180" width="30" height="50" fill="#6b4a2f"/>
<rect x="280" y="120" width="140" height="110" fill="#f7d774"/><polygon points="270,120 350,70 430,120" fill="#8a97a8"/><rect x="300" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="370" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="335" y="180" width="30" height="50" fill="#6b4a2f"/>
<rect x="470" y="120" width="140" height="110" fill="#b8d8a8"/><polygon points="460,120 540,70 620,120" fill="#b5654a"/><rect x="490" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="560" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="525" y="180" width="30" height="50" fill="#6b4a2f"/>
<rect x="660" y="120" width="140" height="110" fill="#e8a8b8"/><polygon points="650,120 730,70 810,120" fill="#8a97a8"/><rect x="680" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="750" y="140" width="25" height="30" fill="#7a9bb5"/><rect x="715" y="180" width="30" height="50" fill="#6b4a2f"/>
<polygon points="240,230 340,230 420,180 320,180" fill="#d8d8d8" opacity="0.8"/><text x="450" y="245" font-family="sans-serif" font-size="14" fill="#1f3a5f" text-anchor="middle" dy="-18">Bóng đổ chéo xuống vỉa hè</text>
<text x="450" y="288" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">Sơ đồ minh họa tự vẽ, không phải ảnh chụp tranh thật.</text>
</svg>