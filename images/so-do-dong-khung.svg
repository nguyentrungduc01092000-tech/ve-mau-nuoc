<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sơ đồ khung tranh cắt ngang: kính, khoảng trống, tranh, bìa lót không axit">
  <rect width="900" height="300" fill="#f7f3ea"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Khung tranh cắt ngang: tranh không bao giờ chạm kính</text>
  <g font-family="sans-serif" font-size="14" fill="#1f3a5f">
    <rect x="60" y="60" width="780" height="160" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <rect x="80" y="80" width="740" height="14" fill="#bcd6f0" stroke="#2e5fa3" stroke-width="1"/>
    <text x="450" y="102" text-anchor="middle" font-weight="bold" font-size="12">Kính lọc UV (chặn 99% tia UV)</text>
    <rect x="80" y="110" width="740" height="26" fill="#f7f3ea"/>
    <text x="450" y="128" text-anchor="middle" font-size="12">Khoảng trống do bìa lót tạo ra</text>
    <rect x="80" y="140" width="740" height="30" fill="#e87a9b" opacity="0.5" stroke="#b3543f" stroke-width="1"/>
    <text x="450" y="159" text-anchor="middle" font-weight="bold" font-size="12">Tranh màu nước</text>
    <rect x="80" y="174" width="740" height="26" fill="#d9e8c9" stroke="#2e7d4f" stroke-width="1"/>
    <text x="450" y="192" text-anchor="middle" font-size="12">Bìa lót không axit / 100% cotton rag</text>
    <text x="450" y="215" text-anchor="middle" font-size="12">Bìa lưng không axit ở sau — gắn tranh bằng băng dính lưu trữ, không dán keo trực tiếp</text>
  </g>
  <text x="450" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">Sơ đồ minh họa được vẽ riêng cho website, không phải ảnh chụp tranh thật.</text>
</svg>
